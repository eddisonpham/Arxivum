<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity — Research Library</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
      </svg>
      <span>Research Library</span>
    </div>
    <div class="nav-links">
      <a href="/">Library</a>
      <a href="/activity" class="active">Activity</a>
      <a href="/demo">Demo</a>
      <a href="/docs">API</a>
    </div>
    <div id="model-indicator" class="model-indicator">
      <span class="dot dot-idle"></span><span class="model-text">Idle</span>
    </div>
  </nav>

  <main class="container">
    <section class="card">
      <div class="table-header">
        <h2>Activity Log <span class="badge" id="activity-count"></span></h2>
        <button id="refresh-activity" class="btn btn-ghost">Refresh</button>
      </div>
      <div id="activity-feed" class="activity-feed">
        <div class="loading-state"><div class="spinner"></div><p>Loading activity…</p></div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
  <script>
    document.getElementById("refresh-activity")?.addEventListener("click", loadActivity);
  </script>
</body>
</html>
