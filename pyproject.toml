[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-library-mcp"
version = "0.1.0"
description = "A local-first MCP server for arXiv paper research, summarization, and idea generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arxivum" }]
keywords = ["mcp", "arxiv", "research", "rag", "llm", "llama-cpp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "mcp>=1.0.0",
    "arxiv>=2.1.0",
    "httpx>=0.27",
    "sentence-transformers>=2.7",
    "chromadb>=0.5.0",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.23",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Install with: pip install -e ".[llm]" for local LLM inference.
# Requires C++ build tools (CMake + compiler).
llm = [
    "llama-cpp-python>=0.2.80",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
]

[project.scripts]
research-mcp = "src.mcp_server.server:main"
research-api = "src.api.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Exclude smoke tests from default runs (they need real models + network).
# Run them explicitly: pytest tests/smoke/ -v -s
norecursedirs = ["tests/smoke", "smoke"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/frontend/*", "smoke/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
